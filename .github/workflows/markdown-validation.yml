name: Markdown Validation

on:
  pull_request:
  push:
    branches:
      - main
      - "features/**"

jobs:
  markdown-links:
    name: Markdown Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check local Markdown links
        run: python scripts/check-markdown-links.py
